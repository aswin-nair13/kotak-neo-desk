services:
  app:
    build: .
    env_file: .env
    environment:
      # Consistent IST log timestamps + sane exchange-day rollover in the app.
      - TZ=Asia/Kolkata
    restart: unless-stopped
    expose: ["8000"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Tailscale (option A): publish to loopback only — `tailscale serve` fronts TLS
    # on the tailnet and proxies here. No public 80/443.
    ports:
      - "127.0.0.1:80:80"
      # Option B (sslip.io + Let's Encrypt): replace the line above with:
      # - "80:80"
      # - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
